# Salve como .github/workflows/agenda.yml (junto com scrape_agenda.py na raiz do repositório)
name: Atualiza agenda
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:       # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright python-dateutil requests && playwright install --with-deps chromium
      - run: python scrape_agenda.py --out agenda_7dias.json
      - name: Commit se mudou
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add agenda_7dias.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza agenda"
            git push
          fi
